name: Live wind and beach safety

# Every 30 minutes: BoM wind observations (public FTP) into data/live.json.
# Once a day (first run after 4am Brisbane): Beachsafe patrols and hazards into data/safety.json.
on:
  schedule:
    - cron: '4,34 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch wind and beach safety
        run: python -I tools/live.py
      - name: Commit the data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live.json data/safety.json
          if git diff --cached --quiet; then echo 'No change'; exit 0; fi
          git commit -q -m 'Update live wind'
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
