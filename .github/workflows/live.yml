name: Live wind and beach safety

# GitHub runs frequent cron schedules late or not at all, so this job keeps itself going:
# each run loops for about 5h45m, fetching BoM wind (public FTP) into data/live.json every
# 10 minutes, then starts the next run itself. Beachsafe patrols and hazards go into
# data/safety.json once a day (first fetch after 4am Brisbane).
# The hourly schedule only restarts the chain if a run ever fails to hand over.
# To stop it: disable this workflow in the Actions tab.
on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Its own group, so the long run never holds up the track-record job (group "data").
# A run that arrives while one is looping waits, and only the newest waiting run is kept.
concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and commit every 10 minutes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          end=$(( $(date +%s) + 345 * 60 ))
          while :; do
            git pull --rebase -q || git rebase --abort || true
            if python -I tools/live.py; then
              git add data/live.json data/safety.json
              if git diff --cached --quiet; then
                echo 'No change'
              else
                git commit -q -m 'Update live wind'
                for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
              fi
            fi
            [ $(( $(date +%s) + 600 )) -lt "$end" ] || break
            sleep 600
          done
      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live.yml --ref main
